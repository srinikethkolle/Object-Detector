<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>YOLO Object Detection</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            color: #222;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
            text-align: center;
        }

        h1 {
            margin-bottom: 25px;
        }

        .camera-container {
            position: relative;
            width: 100%;
            max-width: 900px;
            margin: auto;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
        }

        /*
         * SHOW THE WEBCAM
         */
        #video {
            width: 100%;
            display: block;
        }

        /*
         * YOLO OUTPUT
         */
        #output {
            width: 100%;
            display: none;
        }

        .controls {
            margin: 20px 0;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            margin: 5px;
        }

        #startBtn {
            background: #28a745;
            color: white;
        }

        #stopBtn {
            background: #dc3545;
            color: white;
        }

        button:hover {
            opacity: 0.85;
        }

        .status {
            margin: 15px;
            font-weight: bold;
        }

        .detections {
            margin-top: 25px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: left;
        }

        .detection-item {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        .detection-item:last-child {
            border-bottom: none;
        }

        .error {
            color: red;
        }

    </style>

</head>


<body>

<div class="container">

    <h1>YOLO Object Detection</h1>


    <!-- CAMERA -->
    <div class="camera-container">

        <video
            id="video"
            autoplay
            playsinline>
        </video>

        <!-- YOLO processed image -->
        <img
            id="output"
            alt="YOLO Detection Output">

    </div>


    <!-- BUTTONS -->

    <div class="controls">

        <button id="startBtn">
            Start Camera
        </button>

        <button id="stopBtn">
            Stop Camera
        </button>

    </div>


    <!-- STATUS -->

    <div
        class="status"
        id="status">

        Camera stopped

    </div>


    <!-- DETECTIONS -->

    <div class="detections">

        <h2>Detected Objects</h2>

        <div id="detectionList">
            No objects detected
        </div>

    </div>


    <!-- Hidden canvas -->

    <canvas
        id="canvas"
        style="display:none;">
    </canvas>

</div>


<script>

const video =
    document.getElementById("video");

const output =
    document.getElementById("output");

const canvas =
    document.getElementById("canvas");

const startBtn =
    document.getElementById("startBtn");

const stopBtn =
    document.getElementById("stopBtn");

const status =
    document.getElementById("status");

const detectionList =
    document.getElementById("detectionList");


let stream = null;

let detecting = false;

let processing = false;


// =====================================
// START CAMERA
// =====================================

startBtn.addEventListener("click", async () => {

    try {

        console.log("Requesting camera...");

        stream =
            await navigator.mediaDevices.getUserMedia({

                video: {
                    width: 640,
                    height: 480
                },

                audio: false

            });


        video.srcObject = stream;


        status.innerText =
            "Camera started";


        console.log(
            "Camera started successfully"
        );


        /*
         * Wait until video has dimensions
         */

        video.onloadedmetadata = () => {

            console.log(
                "Video dimensions:",
                video.videoWidth,
                video.videoHeight
            );

            detecting = true;

            status.innerText =
                "Camera running - detecting objects...";

            detectFrame();

        };


    } catch (error) {

        console.error(
            "Camera error:",
            error
        );

        status.innerText =
            "Camera error: " + error.message;

        status.classList.add("error");

    }

});


// =====================================
// STOP CAMERA
// =====================================

stopBtn.addEventListener("click", () => {

    detecting = false;

    processing = false;


    if (stream) {

        stream
            .getTracks()
            .forEach(track => track.stop());

        stream = null;

    }


    video.srcObject = null;


    output.style.display = "none";

    video.style.display = "block";


    status.innerText =
        "Camera stopped";


    detectionList.innerHTML =
        "No objects detected";

});


// =====================================
// DETECT FRAME
// =====================================

async function detectFrame() {

    if (!detecting || !stream) {
        return;
    }


    /*
     * Don't send another frame while
     * previous YOLO request is processing.
     */

    if (processing) {

        setTimeout(
            detectFrame,
            50
        );

        return;

    }


    processing = true;


    try {

        const width =
            video.videoWidth;

        const height =
            video.videoHeight;


        if (width === 0 || height === 0) {

            processing = false;

            setTimeout(
                detectFrame,
                100
            );

            return;

        }


        // Set canvas size

        canvas.width = width;

        canvas.height = height;


        // Draw webcam frame

        const context =
            canvas.getContext("2d");

        context.drawImage(
            video,
            0,
            0,
            width,
            height
        );


        /*
         * Convert webcam frame to JPEG
         */

        const image =
            canvas.toDataURL(
                "image/jpeg",
                0.7
            );


        console.log(
            "Sending frame to Flask..."
        );


        /*
         * Send frame to Flask
         */

        const response =
            await fetch(
                "/detect",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        image: image
                    })

                }
            );


        /*
         * Check HTTP status
         */

        if (!response.ok) {

            throw new Error(
                "Server returned HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        console.log(
            "Flask response:",
            data
        );


        if (data.success) {

            /*
             * Show YOLO output
             */

            output.src =
                data.image;

            output.style.display =
                "block";

            video.style.display =
                "none";


            /*
             * Show detections
             */

            displayDetections(
                data.detections
            );

        } else {

            console.error(
                "YOLO error:",
                data.error
            );

            status.innerText =
                "YOLO error: " +
                data.error;

        }


    } catch (error) {

        console.error(
            "Detection error:",
            error
        );

        status.innerText =
            "Detection error: " +
            error.message;

    }


    processing = false;


    /*
     * Continue detection
     */

    if (detecting) {

        setTimeout(
            detectFrame,
            100
        );

    }

}


// =====================================
// DISPLAY DETECTIONS
// =====================================

function displayDetections(
    detections
) {

    if (
        !detections ||
        detections.length === 0
    ) {

        detectionList.innerHTML =
            "No objects detected";

        return;

    }


    detectionList.innerHTML = "";


    detections.forEach(
        (detection) => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "detection-item";


            div.innerHTML = `

                <strong>
                    ${detection.class_name}
                </strong>

                -

                ${(detection.confidence * 100)
                    .toFixed(1)}%

            `;


            detectionList.appendChild(
                div
            );

        }
    );

}

</script>

</body>

</html>
