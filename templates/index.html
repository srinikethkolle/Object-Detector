<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>YOLO Object Detection</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family:
                Arial,
                sans-serif;

            background:
                #f4f4f4;

            color: #222;

        }


        .container {

            max-width: 1100px;

            margin:
                30px auto;

            padding:
                20px;

            text-align:
                center;

        }


        h1 {

            margin-bottom:
                25px;

        }


        /* ==================================
           CAMERA
           ================================== */

        .camera-container {

            position:
                relative;

            width:
                100%;

            max-width:
                900px;

            margin:
                auto;

            background:
                #000;

            border-radius:
                10px;

            overflow:
                hidden;

        }


        #video {

            width:
                100%;

            display:
                block;

        }


        #output {

            width:
                100%;

            display:
                none;

        }


        /* ==================================
           CONTROLS
           ================================== */

        .controls {

            margin:
                20px 0;

        }


        select {

            padding:
                12px;

            font-size:
                16px;

            border:
                1px solid #ccc;

            border-radius:
                6px;

            min-width:
                300px;

        }


        button {

            padding:
                12px 20px;

            border:
                none;

            border-radius:
                6px;

            cursor:
                pointer;

            font-size:
                16px;

            margin:
                5px;

        }


        #startBtn {

            background:
                #28a745;

            color:
                white;

        }


        #stopBtn {

            background:
                #dc3545;

            color:
                white;

        }


        #switchBtn {

            background:
                #007bff;

            color:
                white;

        }


        button:hover {

            opacity:
                0.85;

        }


        button:disabled {

            opacity:
                0.5;

            cursor:
                not-allowed;

        }


        /* ==================================
           STATUS
           ================================== */

        .status {

            margin:
                15px;

            font-weight:
                bold;

        }


        .error {

            color:
                red;

        }


        .success {

            color:
                green;

        }


        /* ==================================
           INFO
           ================================== */

        .info {

            display:
                flex;

            justify-content:
                center;

            gap:
                20px;

            flex-wrap:
                wrap;

            margin:
                20px 0;

        }


        .info-box {

            background:
                white;

            padding:
                15px 25px;

            border-radius:
                8px;

            min-width:
                150px;

        }


        .info-box strong {

            display:
                block;

            font-size:
                24px;

        }


        .info-box span {

            color:
                #666;

        }


        /* ==================================
           DETECTIONS
           ================================== */

        .detections {

            margin-top:
                25px;

            background:
                white;

            padding:
                20px;

            border-radius:
                10px;

            text-align:
                left;

        }


        .detection-item {

            padding:
                12px;

            border-bottom:
                1px solid #ddd;

        }


        .detection-item:last-child {

            border-bottom:
                none;

        }


        .badge {

            display:
                inline-block;

            padding:
                4px 8px;

            border-radius:
                5px;

            background:
                #eee;

            margin-left:
                5px;

        }


        .camera-selector {

            margin-bottom:
                15px;

        }


        .camera-selector label {

            display:
                block;

            margin-bottom:
                8px;

            font-weight:
                bold;

        }


        #loading {

            display:
                none;

            margin:
                10px;

        }

    </style>

</head>


<body>


<div class="container">


    <h1>
        YOLO Object Detection
    </h1>


    <!-- =================================
         CAMERA SELECTOR
         ================================= -->

    <div class="camera-selector">

        <label for="cameraSelect">
            Select Camera
        </label>


        <select id="cameraSelect">

            <option value="">
                Detecting cameras...
            </option>

        </select>

    </div>


    <!-- =================================
         CAMERA
         ================================= -->

    <div class="camera-container">

        <video
            id="video"
            autoplay
            playsinline>
        </video>


        <img
            id="output"
            alt="YOLO Detection Output">

    </div>


    <!-- =================================
         BUTTONS
         ================================= -->

    <div class="controls">

        <button id="startBtn">
            Start Camera
        </button>


        <button id="switchBtn">
            Switch Camera
        </button>


        <button id="stopBtn">
            Stop Camera
        </button>

    </div>


    <!-- =================================
         STATUS
         ================================= -->

    <div
        id="status"
        class="status">

        Camera stopped

    </div>


    <div
        id="loading">

        Processing frame...

    </div>


    <!-- =================================
         INFORMATION
         ================================= -->

    <div class="info">


        <div class="info-box">

            <strong id="objectCount">
                0
            </strong>

            <span>
                Objects
            </span>

        </div>


        <div class="info-box">

            <strong id="processingTime">
                0s
            </strong>

            <span>
                Processing Time
            </span>

        </div>


        <div class="info-box">

            <strong id="cameraStatus">
                OFF
            </strong>

            <span>
                Camera
            </span>

        </div>

    </div>


    <!-- =================================
         DETECTIONS
         ================================= -->

    <div class="detections">

        <h2>
            Detected Objects
        </h2>


        <div id="detectionList">

            No objects detected

        </div>

    </div>


    <!-- Hidden canvas -->

    <canvas
        id="canvas"
        style="display:none;">
    </canvas>


</div>


<script>


// ==========================================
// ELEMENTS
// ==========================================

const video =
    document.getElementById(
        "video"
    );


const output =
    document.getElementById(
        "output"
    );


const canvas =
    document.getElementById(
        "canvas"
    );


const startBtn =
    document.getElementById(
        "startBtn"
    );


const stopBtn =
    document.getElementById(
        "stopBtn"
    );


const switchBtn =
    document.getElementById(
        "switchBtn"
    );


const cameraSelect =
    document.getElementById(
        "cameraSelect"
    );


const status =
    document.getElementById(
        "status"
    );


const detectionList =
    document.getElementById(
        "detectionList"
    );


const objectCount =
    document.getElementById(
        "objectCount"
    );


const processingTime =
    document.getElementById(
        "processingTime"
    );


const cameraStatus =
    document.getElementById(
        "cameraStatus"
    );


// ==========================================
// VARIABLES
// ==========================================

let stream = null;

let detecting = false;

let processing = false;


// ==========================================
// GET CAMERAS
// ==========================================

async function getCameras() {

    try {

        /*
         * Request permission first.
         * Browser often hides camera labels
         * until permission has been granted.
         */

        if (!stream) {

            const tempStream =
                await navigator.mediaDevices
                    .getUserMedia({
                        video: true,
                        audio: false
                    });


            tempStream
                .getTracks()
                .forEach(
                    track => track.stop()
                );

        }


        const devices =
            await navigator.mediaDevices
                .enumerateDevices();


        const cameras =
            devices.filter(
                device =>
                    device.kind ===
                    "videoinput"
            );


        cameraSelect.innerHTML = "";


        if (cameras.length === 0) {

            cameraSelect.innerHTML = `
                <option>
                    No cameras found
                </option>
            `;

            return;

        }


        cameras.forEach(
            (camera, index) => {

                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    camera.deviceId;


                option.textContent =
                    camera.label ||
                    `Camera ${index + 1}`;


                cameraSelect.appendChild(
                    option
                );

            }
        );


        console.log(
            "Cameras found:",
            cameras
        );

    }
    catch (error) {

        console.error(
            "Could not get cameras:",
            error
        );


        status.innerText =
            "Camera permission error: "
            + error.message;


        status.classList.add(
            "error"
        );

    }

}


// ==========================================
// START CAMERA
// ==========================================

async function startCamera(
    deviceId = null
) {

    try {

        /*
         * Stop existing camera
         */

        if (stream) {

            stream
                .getTracks()
                .forEach(
                    track => track.stop()
                );

            stream = null;

        }


        status.classList.remove(
            "error"
        );


        status.innerText =
            "Starting camera...";


        /*
         * Camera constraints
         */

        const constraints = {

            video: {

                width: {
                    ideal: 640
                },

                height: {
                    ideal: 480
                }

            },

            audio: false

        };


        /*
         * If a specific camera was selected
         */

        if (deviceId) {

            constraints.video.deviceId = {
                exact: deviceId
            };

        }


        /*
         * Request camera
         */

        stream =
            await navigator.mediaDevices
                .getUserMedia(
                    constraints
                );


        video.srcObject =
            stream;


        /*
         * Get actual camera ID
         */

        const track =
            stream.getVideoTracks()[0];


        const settings =
            track.getSettings();


        console.log(
            "Camera settings:",
            settings
        );


        /*
         * Update dropdown
         */

        if (settings.deviceId) {

            cameraSelect.value =
                settings.deviceId;

        }


        video.onloadedmetadata =
            async () => {

                await video.play();


                detecting = true;

                processing = false;


                video.style.display =
                    "block";


                output.style.display =
                    "none";


                status.innerText =
                    "Camera running - detecting...";


                cameraStatus.innerText =
                    "ON";


                /*
                 * Start detection
                 */

                detectFrame();

            };


    }
    catch (error) {

        console.error(
            "Camera error:",
            error
        );


        status.innerText =
            "Camera error: " +
            error.message;


        status.classList.add(
            "error"
        );


        cameraStatus.innerText =
            "ERROR";

    }

}


// ==========================================
// STOP CAMERA
// ==========================================

function stopCamera() {

    detecting = false;

    processing = false;


    if (stream) {

        stream
            .getTracks()
            .forEach(
                track => track.stop()
            );

        stream = null;

    }


    video.srcObject =
        null;


    video.style.display =
        "block";


    output.style.display =
        "none";


    status.innerText =
        "Camera stopped";


    cameraStatus.innerText =
        "OFF";


    objectCount.innerText =
        "0";


    processingTime.innerText =
        "0s";


    detectionList.innerHTML =
        "No objects detected";

}


// ==========================================
// DETECT FRAME
// ==========================================

async function detectFrame() {

    if (
        !detecting ||
        !stream
    ) {

        return;

    }


    /*
     * Do not send another request
     * while YOLO is processing.
     */

    if (processing) {

        return;

    }


    processing = true;


    try {

        const width =
            video.videoWidth;


        const height =
            video.videoHeight;


        if (
            width === 0 ||
            height === 0
        ) {

            processing = false;


            if (detecting) {

                setTimeout(
                    detectFrame,
                    500
                );

            }

            return;

        }


        /*
         * Canvas
         */

        canvas.width =
            width;

        canvas.height =
            height;


        const context =
            canvas.getContext(
                "2d"
            );


        context.drawImage(
            video,
            0,
            0,
            width,
            height
        );


        /*
         * Convert to JPEG
         */

        const image =
            canvas.toDataURL(
                "image/jpeg",
                0.65
            );


        console.log(
            "Sending frame..."
        );


        /*
         * Send to Flask
         */

        const response =
            await fetch(
                "/detect",
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({
                            image: image
                        })

                }
            );


        if (!response.ok) {

            throw new Error(
                "Server returned HTTP "
                + response.status
            );

        }


        const data =
            await response.json();


        console.log(
            "YOLO response:",
            data
        );


        if (!data.success) {

            throw new Error(
                data.error ||
                "YOLO detection failed"
            );

        }


        /*
         * Show output
         */

        output.src =
            data.image;


        output.style.display =
            "block";


        video.style.display =
            "none";


        /*
         * Update stats
         */

        objectCount.innerText =
            data.detections.length;


        processingTime.innerText =
            data.processing_time + "s";


        /*
         * Display detections
         */

        displayDetections(
            data.detections
        );


        status.innerText =
            "YOLO detection running";


        status.classList.remove(
            "error"
        );

    }
    catch (error) {

        console.error(
            "Detection error:",
            error
        );


        status.innerText =
            "Detection error: "
            + error.message;


        status.classList.add(
            "error"
        );

    }


    processing = false;


    /*
     * Wait before next frame.
     *
     * We intentionally don't use 100ms here.
     * Render CPU inference may take several seconds.
     */

    if (detecting) {

        setTimeout(
            detectFrame,
            200
        );

    }

}


// ==========================================
// DISPLAY DETECTIONS
// ==========================================

function displayDetections(
    detections
) {

    if (
        !detections ||
        detections.length === 0
    ) {

        detectionList.innerHTML =
            "No objects detected";

        return;

    }


    detectionList.innerHTML = "";


    detections.forEach(
        detection => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "detection-item";


            const confidence =
                (
                    detection.confidence *
                    100
                ).toFixed(1);


            div.innerHTML = `

                <strong>
                    ${detection.class_name}
                </strong>

                <span class="badge">
                    ${confidence}%
                </span>

            `;


            detectionList.appendChild(
                div
            );

        }
    );

}


// ==========================================
// BUTTON EVENTS
// ==========================================

startBtn.addEventListener(
    "click",
    async () => {

        const deviceId =
            cameraSelect.value;

        await startCamera(
            deviceId
        );

        /*
         * Refresh camera list after
         * permission is granted.
         */

        await getCameras();

    }
);


stopBtn.addEventListener(
    "click",
    () => {

        stopCamera();

    }
);


switchBtn.addEventListener(
    "click",
    async () => {

        const cameras =
            cameraSelect.options;


        if (cameras.length < 2) {

            status.innerText =
                "Only one camera detected";

            return;

        }


        let currentIndex =
            cameraSelect.selectedIndex;


        let nextIndex =
            currentIndex + 1;


        if (
            nextIndex >=
            cameras.length
        ) {

            nextIndex = 0;

        }


        cameraSelect.selectedIndex =
            nextIndex;


        const deviceId =
            cameraSelect.value;


        await startCamera(
            deviceId
        );

    }
);


// ==========================================
// CAMERA DROPDOWN CHANGE
// ==========================================

cameraSelect.addEventListener(
    "change",
    async () => {

        const deviceId =
            cameraSelect.value;


        if (!deviceId) {
            return;
        }


        /*
         * If camera is already running,
         * switch immediately.
         */

        if (stream) {

            await startCamera(
                deviceId
            );

        }

    }
);


// ==========================================
// INITIALIZE
// ==========================================

window.addEventListener(
    "load",
    async () => {

        await getCameras();

    }
);


</script>


</body>

</html>
